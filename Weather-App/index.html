<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- ********************Header*********************** -->
    <div class="loader-container">
      <span class="loader"></span>
    </div>

    <header class="weather-app">
      <span class="weather">
        <img src="images/weather.png" /> weather App<input
          type="text"
          placeholder="Search for tempreture"
          class="search"
        />
      </span>

      <div class="switch">
        <label>
          <span class="C"> °C </span>
          <span class="F"> °F </span>
        </label>
      </div>
    </header>

    <!-- ****************Alert********************* -->
    <div class="error">
      <p>
        <i class="fa-solid fa-skull-crossbones"></i> Please,Enter Name Correct
      </p>
    </div>

    <!-- loading -->
    <div class="loader-container">
      <span class="loader"></span>
    </div>
    <!-- ******************************************* -->
    <!-- ********************End of Header*********************** -->
    <section class="main">
      <section class="part1">
        <!-- ******************************************* -->
        <!-- *********************City&Image********************** -->

        <div class="cityAndimage">
          <div class="city">
            <p class="date">--</p>
            <p class="name">Cairo</p>
            <p class="temp">--</p>
          </div>
          <div class="image">
            <img src="" />
          </div>
        </div>
        <!-- ******************************************* -->
        <!-- *********************End of City&Image********************** -->
        <!-- ******************************************* -->
        <!-- *********************Weather Forecast********************** -->

        <div class="forecast">
          <p class="todayisforecast">TODAY'S FORECAST</p>
          <div class="forecastsections"></div>
        </div>

        <!-- ******************************************* -->
        <!-- *********************End of Weather Forecast********************** -->
        <!-- ******************************************* -->
        <!-- ********************* Weather Details********************** -->

        <div class="weather-details">
          <p class="weatherdetails-p">weather details</p>
          <div class="weatherdetails2">
            <!-- **********sunrise*********** -->
            <div class="sunrise">
              <div class="sunrise-left">
                <p class="p-sunrise1">Sunrise</p>
                <p class="p-sunrise2">00:00 am</p>
              </div>
              <div class="sunrise-right">
                <img src="images/sunrise.png" />
              </div>
            </div>
            <!-- **********sunset*********** -->

            <div class="sunset">
              <div class="sunset-left">
                <p class="p-sunset1">Sunset</p>
                <p class="p-sunset2">00:00 am</p>
              </div>
              <div class="sunset-right">
                <img src="images/sunset.png" />
              </div>
            </div>
            <!-- **********chanceofrain*********** -->

            <div class="chanceofrain">
              <div class="chanceofrain-left">
                <p class="p-chanceofrain1">Chance of Rain</p>
                <p class="p-chanceofrain2">00:00 am</p>
              </div>
              <div class="chanceofrain-right">
                <img src="images/rain.png" />
              </div>
            </div>
            <!-- **********wind*********** -->

            <div class="wind">
              <div class="wind-left">
                <p class="p-wind1">Wind</p>
                <p class="p-wind2">00:00 am</p>
              </div>
              <div class="wind-right">
                <img src="images/wind.png" />
              </div>
            </div>
            <!-- **********UV index*********** -->

            <div class="UVindex">
              <div class="UVindex-left">
                <p class="p-UVindex1">UV index</p>
                <p class="p-UVindex2">00:00 am</p>
              </div>
              <div class="UVindex-right">
                <img src="images/UV.png" />
              </div>
            </div>
            <!-- **********fellslike*********** -->

            <div class="fellslike">
              <div class="fellslike-left">
                <p class="p-fellslike1">Fells Like</p>
                <p class="p-fellslike2">00:00 am</p>
              </div>
              <div class="fellslike-right">
                <img src="images/fellslike.png" />
              </div>
            </div>
          </div>
        </div>
        <!-- ******************************************* -->
        <!-- *********************End of Weather Details********************** -->
      </section>
      <!-- ******************************************* -->
      <!-- *********************End of main section********************** -->
      <section class="part2">
        <p class="sevendays-forecast">3 DAYS FORECAST</p>
        <div class="days"></div>
      </section>
    </section>

    <!-- *********************************** -->
    <!-- *************************Java script******************************* -->

    <script src="external.js"></script>
  </body>
</html>

<!-- ****************************** -->
